name: Database Migrations

on:
  push:
    branches: [ "main" ]

jobs:
  migrate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mydb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flyway
        uses: red-gate/setup-flyway@v3
        with:
          edition: 'community'
          i-agree-to-the-eula: true

      - name: Run Migrations
        run: |
          flyway migrate \
            -url="jdbc:postgresql://localhost:5432/mydb" \
            -user="user" \
            -password="password" \
            -locations="filesystem:./sql/migrations"